<!DOCTYPE html>
<html>
<head><title>Generate Icons</title></head>
<body>
<p>Klik tombol untuk download icon. Simpan sebagai icon-192.png dan icon-512.png di folder public/</p>
<canvas id="c192" width="192" height="192"></canvas>
<canvas id="c512" width="512" height="512"></canvas>
<br><br>
<button onclick="download(192)">Download icon-192.png</button>
<button onclick="download(512)">Download icon-512.png</button>

<script>
function drawIcon(size) {
  const canvas = document.getElementById('c' + size)
  const ctx = canvas.getContext('2d')
  const r = size * 0.15

  // Background
  const grad = ctx.createLinearGradient(0, 0, size, size)
  grad.addColorStop(0, '#7c3aed')
  grad.addColorStop(1, '#4f46e5')
  ctx.fillStyle = grad
  ctx.beginPath()
  ctx.moveTo(r, 0)
  ctx.lineTo(size - r, 0)
  ctx.quadraticCurveTo(size, 0, size, r)
  ctx.lineTo(size, size - r)
  ctx.quadraticCurveTo(size, size, size - r, size)
  ctx.lineTo(r, size)
  ctx.quadraticCurveTo(0, size, 0, size - r)
  ctx.lineTo(0, r)
  ctx.quadraticCurveTo(0, 0, r, 0)
  ctx.closePath()
  ctx.fill()

  // Wallet icon
  const s = size * 0.5
  const x = (size - s) / 2
  const y = (size - s) / 2
  ctx.fillStyle = 'white'
  ctx.font = `bold ${s}px serif`
  ctx.textAlign = 'center'
  ctx.textBaseline = 'middle'
  ctx.fillText('💰', size/2, size/2)
}

drawIcon(192)
drawIcon(512)

function download(size) {
  const canvas = document.getElementById('c' + size)
  const a = document.createElement('a')
  a.download = `icon-${size}.png`
  a.href = canvas.toDataURL('image/png')
  a.click()
}
</script>
</body>
</html>
